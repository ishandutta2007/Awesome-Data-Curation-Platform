<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradient 1 -->
    <linearGradient id="accent-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#8b5cf6;#3b82f6;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#06b6d4;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Accent Gradient 2 -->
    <linearGradient id="glow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
    .data-node {
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .floating-group {
      animation: float 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Ambient Glow Spheres -->
  <circle cx="1000" cy="100" r="180" fill="url(#glow-grad)" filter="url(#glow)">
    <animate attributeName="cx" values="1000;1050;1000" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="280" r="140" fill="#6366f1" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Geometric Abstract Network / Data Nodes (Dynamic graphics) -->
  <g class="floating-group" opacity="0.85">
    <!-- Connecting Lines -->
    <path d="M 850 90 L 980 140 L 1080 80 L 1120 200 L 990 260 L 890 200 Z" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
    <path d="M 980 140 L 890 200 M 980 140 L 990 260 M 850 90 L 1080 80" fill="none" stroke="#475569" stroke-width="1.2" />

    <!-- Animated Data Pulses -->
    <line x1="850" y1="90" x2="980" y2="140" stroke="url(#accent-cyan-purple)" stroke-width="2.5">
      <animate attributeName="stroke-dashoffset" values="200;0" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="980" y1="140" x2="990" y2="260" stroke="#a855f7" stroke-width="2.5">
      <animate attributeName="stroke-dashoffset" values="0;200" dur="4s" repeatCount="indefinite" />
    </line>

    <!-- Node 1 -->
    <g transform="translate(850, 90)">
      <circle r="16" fill="#0f172a" stroke="#06b6d4" stroke-width="2" filter="url(#subtle-glow)" />
      <circle r="6" fill="#38bdf8">
        <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Node 2 (Center Curation Hub) -->
    <g transform="translate(980, 140)">
      <circle r="26" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow)" />
      <circle r="12" fill="#a855f7">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Node 3 -->
    <g transform="translate(1080, 80)">
      <circle r="14" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
      <circle r="5" fill="#f472b6" />
    </g>

    <!-- Node 4 -->
    <g transform="translate(1120, 200)">
      <circle r="18" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
      <circle r="7" fill="#60a5fa" />
    </g>

    <!-- Node 5 -->
    <g transform="translate(990, 260)">
      <circle r="20" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#subtle-glow)" />
      <circle r="8" fill="#34d399">
        <animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Node 6 -->
    <g transform="translate(890, 200)">
      <circle r="15" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
      <circle r="5" fill="#fbbf24" />
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 65)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="225" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="15" cy="15" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="20" class="tag">DATA-CENTRIC AI &amp; MLOPS</text>

    <!-- Main Heading -->
    <text x="0" y="85" fill="url(#accent-cyan-purple)" class="title" filter="url(#subtle-glow)">
      Awesome Data Curation
    </text>
    <text x="0" y="138" fill="#ffffff" class="title">
      Platforms &amp; Tools
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="185" class="subtitle">
      A curated ecosystem of SaaS platforms &amp; open-source repositories for dataset
    </text>
    <text x="0" y="210" class="subtitle">
      management, active learning, embedding selection, annotation &amp; QA.
    </text>

    <!-- Micro Tech Pills -->
    <g transform="translate(0, 235)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="115" height="26" rx="6" fill="#1e293b" opacity="0.8" />
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#cbd5e1">⚡ Active Learning</text>

      <!-- Pill 2 -->
      <rect x="125" y="0" width="135" height="26" rx="6" fill="#1e293b" opacity="0.8" />
      <text x="137" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#cbd5e1">🔍 Embedding Curation</text>

      <!-- Pill 3 -->
      <rect x="270" y="0" width="120" height="26" rx="6" fill="#1e293b" opacity="0.8" />
      <text x="282" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#cbd5e1">🏷️ Smart Labeling</text>

      <!-- Pill 4 -->
      <rect x="400" y="0" width="105" height="26" rx="6" fill="#1e293b" opacity="0.8" />
      <text x="412" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#cbd5e1">📊 Quality QA</text>
    </g>
  </g>

  <!-- Bottom Border Highlight Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accent-cyan-purple)" />
</svg>
